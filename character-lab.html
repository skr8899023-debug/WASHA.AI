<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Puppet Lab — Procedural Creatures</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffb86b'/%3E%3Ccircle cx='11' cy='14' r='3' fill='%232a1f1a'/%3E%3Ccircle cx='21' cy='14' r='3' fill='%232a1f1a'/%3E%3Ccircle cx='12' cy='13' r='1' fill='%23fff'/%3E%3Ccircle cx='22' cy='13' r='1' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #2b2016;
        --ink-soft: rgba(43, 32, 22, 0.62);
        --card: rgba(255, 252, 246, 0.82);
        --card-line: rgba(43, 32, 22, 0.1);
        --accent: #ff8c42;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: "Avenir Next", "Nunito", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(120% 90% at 50% 18%, #fdf7ec 0%, #f4e3c8 52%, #e8cfa9 100%);
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; }
      /* soft vignette for premium depth */
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(115% 100% at 50% 42%, transparent 58%, rgba(96, 62, 26, 0.16) 100%);
      }
      header {
        position: fixed; top: 22px; left: 26px; pointer-events: none;
      }
      header h1 {
        font-size: 21px; letter-spacing: 0.16em; font-weight: 800; text-transform: uppercase;
      }
      header p { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.02em; }
      #stats {
        position: fixed; left: 26px; bottom: 18px; font-size: 11px; color: var(--ink-soft);
        font-family: ui-monospace, "SF Mono", Menlo, monospace; pointer-events: none;
      }
      /* preset dock */
      #dock {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        display: flex; gap: 8px; padding: 8px;
        background: var(--card); border: 1px solid var(--card-line); border-radius: 18px;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 12px 32px rgba(96, 62, 26, 0.16);
      }
      #dock button {
        border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
        padding: 9px 14px; border-radius: 12px; background: transparent; color: var(--ink-soft);
        transition: all 0.15s ease; white-space: nowrap;
      }
      #dock button:hover { background: rgba(43, 32, 22, 0.06); color: var(--ink); }
      #dock button.active { background: var(--ink); color: #fff7ea; }
      #dock button.dice { font-size: 16px; padding: 7px 12px; }
      /* JSON panel */
      #panel {
        position: fixed; top: 22px; right: 22px; width: 330px; max-width: calc(100vw - 44px);
        background: var(--card); border: 1px solid var(--card-line); border-radius: 16px;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 12px 32px rgba(96, 62, 26, 0.16);
        overflow: hidden; transition: transform 0.25s ease, opacity 0.25s ease;
      }
      #panel.hidden { transform: translateX(24px); opacity: 0; pointer-events: none; }
      #panel .head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 14px 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--ink-soft);
      }
      #panel textarea {
        display: block; width: 100%; height: 300px; border: 0; resize: none; outline: none;
        background: rgba(255, 255, 255, 0.5); padding: 12px 14px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; line-height: 1.55;
        color: var(--ink);
      }
      #panel .foot { display: flex; gap: 8px; padding: 10px 12px; align-items: center; }
      #panel .foot button {
        border: 0; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 800;
        padding: 8px 16px; border-radius: 10px; background: var(--ink); color: #fff7ea;
      }
      #panel .foot button:hover { background: #47362a; }
      #jsonError { font-size: 11px; color: #b3401e; flex: 1; line-height: 1.3; }
      #togglePanel {
        position: fixed; top: 22px; right: 22px;
        border: 1px solid var(--card-line); background: var(--card); color: var(--ink-soft);
        font: inherit; font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
        padding: 9px 14px; border-radius: 12px; cursor: pointer;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 24px rgba(96, 62, 26, 0.12);
      }
      #togglePanel.open { opacity: 0; pointer-events: none; }
      #baking {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--ink-soft); opacity: 0; transition: opacity 0.15s; pointer-events: none;
      }
      #baking.on { opacity: 1; }
      @media (max-width: 720px) {
        #panel { display: none; }
        #togglePanel { display: none; }
        header h1 { font-size: 17px; }
      }

      /* ============================== GAME UI ============================== */
      /* the lab UI only exists in lab mode; the game overlay only in game mode */
      body.mode-game #dock,
      body.mode-game #togglePanel,
      body.mode-game #panel,
      body.mode-game #stats,
      body.mode-game header { display: none; }
      body.mode-lab #game { display: none; }

      #game { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", Tahoma, system-ui, sans-serif; }
      #game .hidden { display: none !important; }
      #game button { pointer-events: auto; }

      .gm-screen {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        pointer-events: auto;
      }
      .gm-card {
        background: var(--card); border: 1px solid var(--card-line); border-radius: 24px;
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 18px 48px rgba(96, 62, 26, 0.22);
        padding: 30px 34px; text-align: center; max-width: min(520px, calc(100vw - 40px));
      }
      .gm-logo { font-size: 40px; font-weight: 900; letter-spacing: 0.02em; }
      .gm-tag { color: var(--ink-soft); margin: 8px 0 4px; font-size: 15px; }
      #gm-album-count { color: var(--ink-soft); font-size: 13px; min-height: 20px; margin-bottom: 12px; }
      .gm-primary {
        display: block; width: 100%; margin-top: 10px; border: 0; cursor: pointer;
        font: inherit; font-size: 18px; font-weight: 800; color: #fff7ea;
        background: linear-gradient(135deg, #ff8c42, #e2622b); border-radius: 16px; padding: 14px 20px;
        box-shadow: 0 8px 22px rgba(226, 98, 43, 0.35); transition: transform 0.12s ease;
      }
      .gm-primary:hover { transform: translateY(-2px); }
      .gm-primary:disabled { opacity: 0.45; cursor: default; transform: none; }
      .gm-ghost {
        display: block; width: 100%; margin-top: 10px; border: 1px solid var(--card-line); cursor: pointer;
        font: inherit; font-size: 14px; font-weight: 700; color: var(--ink-soft);
        background: rgba(255, 255, 255, 0.4); border-radius: 14px; padding: 11px 18px;
      }
      .gm-ghost:hover { color: var(--ink); background: rgba(255, 255, 255, 0.7); }
      .gm-row { display: flex; gap: 10px; }
      .gm-row > * { flex: 1; }

      #gm-select h2 { font-size: 24px; font-weight: 900; margin-bottom: 14px; }
      #gm-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
      .gm-pcard {
        border: 2px solid transparent; cursor: pointer; font: inherit;
        background: rgba(255, 255, 255, 0.55); border-radius: 16px; padding: 12px 8px;
        display: flex; flex-direction: column; gap: 4px; align-items: center;
        transition: all 0.12s ease;
      }
      .gm-pcard:hover { background: rgba(255, 255, 255, 0.85); }
      .gm-pcard.active { border-color: #e2622b; background: #fff; box-shadow: 0 6px 18px rgba(226, 98, 43, 0.22); }
      .gm-pname { font-weight: 800; font-size: 15px; }
      .gm-pmove { font-size: 11px; color: var(--ink-soft); }
      .gm-dots { display: flex; gap: 4px; }
      .gm-dots i, .gm-chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(43,32,22,.15); }

      #gm-hud { position: absolute; inset: 0; pointer-events: none; }
      #gm-top {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px; direction: rtl;
        background: var(--card); border: 1px solid var(--card-line); border-radius: 16px;
        padding: 10px 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 26px rgba(96, 62, 26, 0.16);
      }
      #gm-level { font-weight: 900; font-size: 14px; white-space: nowrap; }
      #gm-timer { width: min(240px, 40vw); height: 12px; border-radius: 8px; background: rgba(43, 32, 22, 0.12); overflow: hidden; }
      #gm-timerfill { height: 100%; width: 100%; border-radius: 8px; background: linear-gradient(90deg, #7fc96b, #b8e986); transition: width 0.15s linear; }
      #gm-timerfill.low { background: linear-gradient(90deg, #e2622b, #ff9d5c); }
      #gm-quit {
        border: 0; cursor: pointer; font-size: 15px; font-weight: 800; color: var(--ink-soft);
        width: 30px; height: 30px; border-radius: 10px; background: rgba(43, 32, 22, 0.08);
      }
      #gm-quit:hover { background: rgba(43, 32, 22, 0.16); color: var(--ink); }
      #gm-hint {
        position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
        font-size: 14px; font-weight: 700; color: var(--ink-soft); text-align: center;
        background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 10px 18px;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: calc(100vw - 40px);
      }
      #gm-toast {
        position: absolute; top: 26%; left: 50%; transform: translate(-50%, -50%);
        font-size: 24px; font-weight: 900; color: var(--ink); text-align: center;
        background: var(--card); border: 1px solid var(--card-line); border-radius: 20px; padding: 16px 30px;
        box-shadow: 0 14px 40px rgba(96, 62, 26, 0.25); pointer-events: none; direction: rtl;
      }
      #gm-toast.pop { animation: gmpop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); }
      @keyframes gmpop {
        0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }
      #gm-res-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0 4px; }
      .gm-chip {
        display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
        background: rgba(255, 255, 255, 0.6); border: 1px solid var(--card-line);
        border-radius: 999px; padding: 5px 11px;
      }
      #gm-joy {
        display: none; position: absolute; bottom: 30px; right: 30px;
        width: 124px; height: 124px; border-radius: 50%;
        background: rgba(255, 252, 246, 0.4); border: 1.5px solid rgba(43, 32, 22, 0.18);
        pointer-events: auto; touch-action: none;
      }
      #gm-stick {
        position: absolute; left: 50%; top: 50%; margin: -27px 0 0 -27px;
        width: 54px; height: 54px; border-radius: 50%;
        background: rgba(43, 32, 22, 0.55); pointer-events: none;
      }
      @media (pointer: coarse) {
        #gm-joy:not(.hidden) { display: block; }
      }
      @media (max-width: 620px) {
        #gm-cards { grid-template-columns: repeat(2, 1fr); }
        .gm-logo { font-size: 30px; }
        .gm-card { padding: 22px 20px; }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="vignette"></div>
    <header>
      <h1>Puppet Lab</h1>
      <p>procedural creatures · one seamless soft body · zero assets</p>
    </header>
    <div id="baking">summoning…</div>
    <div id="dock"></div>
    <button id="togglePanel">{ } JSON</button>
    <aside id="panel" class="hidden">
      <div class="head"><span>Character JSON</span><button id="closePanel" style="border:0;background:none;cursor:pointer;font-size:14px;color:inherit">✕</button></div>
      <textarea id="jsonInput" spellcheck="false"></textarea>
      <div class="foot">
        <button id="applyJson">Generate</button>
        <div id="jsonError"></div>
      </div>
    </aside>
    <div id="stats"></div>

    <!-- game overlay -->
    <div id="game" dir="rtl">
      <div id="gm-menu" class="gm-screen hidden">
        <div class="gm-card">
          <div class="gm-logo">🥚 مختبر الدمى</div>
          <p class="gm-tag">مخلوقات عجيبة تُولد أمام عينيك — أمسكها قبل أن تهرب!</p>
          <div id="gm-album-count"></div>
          <button id="gm-start" class="gm-primary">ابدأ اللعب</button>
          <button id="gm-lab" class="gm-ghost">وضع المختبر — توليد حر</button>
        </div>
      </div>

      <div id="gm-select" class="gm-screen hidden">
        <div class="gm-card">
          <h2>اختر بطلك</h2>
          <div id="gm-cards"></div>
          <div class="gm-row">
            <button id="gm-go" class="gm-primary" disabled>انطلق!</button>
            <button id="gm-back" class="gm-ghost">رجوع</button>
          </div>
        </div>
      </div>

      <div id="gm-hud" class="hidden">
        <div id="gm-top">
          <div id="gm-level"></div>
          <div id="gm-timer"><div id="gm-timerfill"></div></div>
          <button id="gm-quit" title="خروج">✕</button>
        </div>
        <div id="gm-hint" class="hidden"></div>
      </div>

      <div id="gm-toast" class="hidden"></div>

      <div id="gm-results" class="gm-screen hidden">
        <div class="gm-card">
          <h2 id="gm-res-title"></h2>
          <p class="gm-tag" id="gm-res-sub"></p>
          <div id="gm-res-chips"></div>
          <div class="gm-row">
            <button id="gm-retry" class="gm-primary">حاول مجدداً</button>
            <button id="gm-menu2" class="gm-ghost">القائمة</button>
          </div>
        </div>
      </div>

      <div id="gm-joy" class="hidden"><div id="gm-stick"></div></div>
    </div>

    <script type="module" src="/src/character-lab/main.ts"></script>
  </body>
</html>
